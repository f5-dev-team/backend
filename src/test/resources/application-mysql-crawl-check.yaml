# 명시적 MySQL 검증에서만 사용한다. 테이블 생성·변경·삭제를 하지 않는다.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/scholarship_crawl_test
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
crawler:
  enabled: false